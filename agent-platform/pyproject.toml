[project]
name = "agent-platform"
version = "0.1.0"
description = "企业级 AI Agent 平台：多 Agent 编排、工具系统、双层记忆、RAG、异步长任务"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    # 数据与配置
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    # 编排
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    # LLM 接入
    "openai>=1.50",
    "anthropic>=0.40",
    "litellm>=1.50",
    "tiktoken>=0.8",
    # 缓存与队列
    "redis>=5.0",
    "arq>=0.26",
    # 安全
    "pyjwt[crypto]>=2.9",
    # 可观测性
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "prometheus-client>=0.20",
    # HTTP 客户端
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "fakeredis[lua]>=2.24",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "ASYNC",     # 异步阻塞调用检查
    "S",         # bandit 安全
    "C4",        # comprehensions
    "DTZ",       # 时区感知 datetime
    "T20",       # 禁 print
    "SIM",       # 简化
    "TID",       # tidy-imports（分层依赖封禁）
    "RUF",
]
ignore = [
    "S101",            # tests 中允许 assert（按目录覆盖更细）
    "RUF001", "RUF002", "RUF003",  # 中文文档字符串使用全角标点，非易混淆错误
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "SIM"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 分层规则的静态兜底（完整规则由 import-linter contracts 校验）
"src.api".msg = "domain/infrastructure 层禁止依赖 api 层"

# ---------------------------------------------------------------------------
# mypy（严格模式）
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["src"]

[[tool.mypy.overrides]]
module = ["arq.*", "litellm.*", "pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
exclude_also = [
    "^\\s*\\.\\.\\.$",          # Protocol / ABC 接口桩
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# import-linter：分层依赖契约
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "分层依赖单向流动"
type = "layers"
layers = [
    "src.api",
    "src.agents",
    "src.tools | src.memory | src.rag",
    "src.llm",
    "src.infrastructure",
    "src.core",
]
